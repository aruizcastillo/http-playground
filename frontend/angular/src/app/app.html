<main>
  <h1>HTTP Playground</h1>

  <section>
    <h2>GET /api/message</h2>

    <button (click)="handleGet()">
      GET with HttpClient
    </button>

    <p>Response: {{ getResponse() }}</p>
  </section>

  <section>
    <h2>POST /api/message</h2>

    <input
      [ngModel]="postMessage()"
      (ngModelChange)="postMessage.set($event)"
      type="text"
      placeholder="Write a message"
    />

    <button (click)="handlePost()">
      POST with HttpClient
    </button>

    <p>Request: {{ postRequest() }}</p>
    <p>Response: {{ postResponse() }}</p>
  </section>
</main>
